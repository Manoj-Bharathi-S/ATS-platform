version: '3.8'

services:
  # ----------------------------------------
  # Job Management Database (Relational)
  # ----------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: ats-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: job_management_db
      MYSQL_USER: ats_user
      MYSQL_PASSWORD: ats_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ats-network

  # ----------------------------------------
  # Resume Processing Database (Document)
  # ----------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: ats-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root_admin
      MONGO_INITDB_ROOT_PASSWORD: root_password
      MONGO_INITDB_DATABASE: resume_processing_db
    volumes:
      - mongo_data:/data/db
    networks:
      - ats-network

# Define persistent storage volumes
volumes:
  mysql_data:
  mongo_data:

# Define a shared network for future microservices
networks:
  ats-network:
    driver: bridge