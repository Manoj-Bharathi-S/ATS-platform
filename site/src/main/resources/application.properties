spring.application.name=site

server.port=${PORT:8081}

# Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_management_db}
spring.datasource.username=${DB_USER:ats_user}
spring.datasource.password=${DB_PASSWORD:ats_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true